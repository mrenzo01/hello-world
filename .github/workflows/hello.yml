name: hello
on:
  workflow_dispatch:          # adds a "Run workflow" button
  schedule:
    - cron: "0 12 * * 3"      # Wed 12:00 UTC = 8:00 AM ET
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import datetime; print('Mush collector alive', datetime.datetime.utcnow())"
